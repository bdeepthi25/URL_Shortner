
spring.application.name=URL_Shortner

# Database Connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=UrlShortenerHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Expired URL cleanup configuration
url.cleanup.retention-days=30
url.cleanup.cron=0 0 2 * * *


# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}

spring.data.redis.port=${REDIS_PORT:6379}

# Redis cache expiration (10 minutes)
url.cache.ttl-seconds=600

# Logging Configuration
logging.level.root=INFO

logging.level.com.github.deepthi.service=INFO



# Application Information
management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true

info.app.name=URL Shortener
info.app.description=REST API for creating and managing short URLs
info.app.version=1.0.0

# Actuator Health Visibility

management.endpoint.health.show-components=when-authorized

management.endpoint.health.show-details=when-authorized

management.endpoint.health.roles=ADMIN